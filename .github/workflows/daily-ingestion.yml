name: Daily content collection
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
concurrency:
  group: taiwanhub-content-ingestion
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh AI-generated demo feed
        if: env.DATABASE_URL != '' && env.ANTHROPIC_API_KEY != ''
        run: pnpm agent:run demo-houston-organizations https://taiwanhub-web.vercel.app/fixtures/demo-houston-org.html organizations "Demo pipeline test (placeholder org)"
      - name: Collect approved sources
        if: env.DATABASE_URL != ''
        run: pnpm ingest run
      - name: Require database configuration
        if: env.DATABASE_URL == ''
        run: exit 1
