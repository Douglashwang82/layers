name: Daily restaurant recommendation (version 2)
# Disabled until environment gates and area policy/budgets are explicitly configured.
on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to run against
        required: true
        type: string
      citySlug:
        description: City slug to run the pipeline for
        required: true
        type: string
permissions:
  contents: read
jobs:
  dispatch:
    if: >-
      (github.event_name == 'schedule' && vars.RESTAURANT_WORKER_ENVIRONMENTS != '') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || vars.RESTAURANT_WORKER_ENVIRONMENTS || '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    concurrency:
      group: taiwanhub-daily-pick-restaurant-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Require explicit enablement
        id: gate
        env:
          RESTAURANT_WORKER_ENABLED: ${{ vars.RESTAURANT_WORKER_ENABLED }}
        run: |
          if [ "$RESTAURANT_WORKER_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "RESTAURANT_WORKER_ENABLED is not true for this environment; nothing to do."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run the restaurant worker
        if: steps.gate.outputs.enabled == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.RESTAURANT_WORKER_DATABASE_URL }}
          FEATURE_RESTAURANT_DISCOVERY_WORKER: ${{ vars.FEATURE_RESTAURANT_DISCOVERY_WORKER }}
          RESTAURANT_PROVIDER_POLICY_APPROVED: ${{ vars.RESTAURANT_PROVIDER_POLICY_APPROVED }}
          GOOGLE_PLACES_SERVER_API_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_PICK_LLM_MODEL: ${{ vars.DAILY_PICK_LLM_MODEL }}
          RESTAURANT_CITY_SLUG: ${{ inputs.citySlug || vars.RESTAURANT_WORKER_CITY_SLUG }}
        run: pnpm daily-pick:restaurant:worker "$RESTAURANT_CITY_SLUG"
