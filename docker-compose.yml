services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: taiwanhub
      POSTGRES_PASSWORD: taiwanhub
      POSTGRES_DB: taiwanhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiwanhub -d taiwanhub"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
